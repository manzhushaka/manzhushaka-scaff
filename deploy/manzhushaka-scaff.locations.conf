location = /gateway/manzhushaka-scaff {
    return 301 /gateway/manzhushaka-scaff/;
}

location = /gateway/manzhushaka-scaff/health {
    proxy_pass http://127.0.0.1:8080/actuator/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /gateway/manzhushaka-scaff/api/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    client_max_body_size 20m;
}

location ^~ /gateway/manzhushaka-scaff/ {
    alias /home/app/manzhushaka-scaff/current/ui-admin-arco/dist/;
    try_files $uri $uri/ /gateway/manzhushaka-scaff/index.html;
    expires -1;
}

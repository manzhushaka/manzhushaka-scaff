<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>%VITE_APP_TITLE%</title>
  <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0px;
      padding: 0px;
    }

    .chromeframe {
      margin: 0.2em 0;
      background: #ccc;
      color: #000;
      padding: 0.2em 0;
    }

    #loader-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #faf8f3;
      color: #16130f;
    }

    .load-progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 7px;
      background: #41413f;
      z-index: 1003;
    }

    .load-progress__bar {
      position: absolute;
      top: 4px;
      left: 0;
      width: 92%;
      height: 2px;
      background: #ff5a35;
      animation: loading-progress 2.2s ease-in-out infinite alternate;
    }

    #loader {
      display: block;
      position: relative;
      width: 44px;
      height: 44px;
      margin: 0;
      border-radius: 50%;
      border: 2px solid #e7e5de;
      border-top-color: #ff5a35;
      border-right-color: #ff5a35;
      -webkit-animation: spin 2s linear infinite;
      -ms-animation: spin 2s linear infinite;
      -moz-animation: spin 2s linear infinite;
      -o-animation: spin 2s linear infinite;
      animation: spin 2s linear infinite;
      z-index: 1001;
    }

    #loader:before {
      content: "";
      display: none;
    }

    #loader:after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      margin: -3px 0 0 -3px;
      border-radius: 50%;
      background: #ff5a35;
    }

    .load-card {
      position: relative;
      z-index: 1002;
      display: flex;
      width: 296px;
      min-height: 138px;
      box-sizing: border-box;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 1px solid #e8e6e1;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 18px 34px rgba(55, 49, 39, 0.1);
    }


    @-webkit-keyframes spin {
      0% {
        -webkit-transform: rotate(0deg);
        -ms-transform: rotate(0deg);
        transform: rotate(0deg);
      }

      100% {
        -webkit-transform: rotate(360deg);
        -ms-transform: rotate(360deg);
        transform: rotate(360deg);
      }
    }

    @keyframes spin {
      0% {
        -webkit-transform: rotate(0deg);
        -ms-transform: rotate(0deg);
        transform: rotate(0deg);
      }

      100% {
        -webkit-transform: rotate(360deg);
        -ms-transform: rotate(360deg);
        transform: rotate(360deg);
      }
    }


    #loader-wrapper .loader-section {
      position: fixed;
      top: 0;
      width: 51%;
      height: 100%;
      background: #faf8f3;
      z-index: 1000;
      -webkit-transform: translateX(0);
      -ms-transform: translateX(0);
      transform: translateX(0);
      pointer-events: none;
    }

    #loader-wrapper .loader-section.section-left {
      left: 0;
    }

    #loader-wrapper .loader-section.section-right {
      right: 0;
    }


    .loaded #loader-wrapper .loader-section.section-left {
      -webkit-transform: translateX(-100%);
      -ms-transform: translateX(-100%);
      transform: translateX(-100%);
      -webkit-transition: all 0.7s 0.3s cubic-bezier(0.645, 0.045, 0.355, 1.000);
      transition: all 0.7s 0.3s cubic-bezier(0.645, 0.045, 0.355, 1.000);
    }

    .loaded #loader-wrapper .loader-section.section-right {
      -webkit-transform: translateX(100%);
      -ms-transform: translateX(100%);
      transform: translateX(100%);
      -webkit-transition: all 0.7s 0.3s cubic-bezier(0.645, 0.045, 0.355, 1.000);
      transition: all 0.7s 0.3s cubic-bezier(0.645, 0.045, 0.355, 1.000);
    }

    .loaded #loader {
      opacity: 0;
      -webkit-transition: all 0.3s ease-out;
      transition: all 0.3s ease-out;
    }

    .loaded #loader-wrapper {
      visibility: hidden;
      -webkit-transform: translateY(-100%);
      -ms-transform: translateY(-100%);
      transform: translateY(-100%);
      -webkit-transition: all 0.3s 1s ease-out;
      transition: all 0.3s 1s ease-out;
    }

    .no-js #loader-wrapper {
      display: none;
    }

    .no-js h1 {
      color: #222222;
    }

    #loader-wrapper .load_title {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-family: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
      color: #5c564c;
      font-size: 12px;
      width: auto;
      text-align: center;
      z-index: 1002;
      position: static;
      opacity: 1;
      line-height: 16px;
    }

    #loader-wrapper .load_title__eyebrow {
      color: #8a8377;
      font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      font-weight: 600;
      line-height: 14px;
      letter-spacing: 0;
    }

    #loader-wrapper .load_title__message {
      color: #3f3a33;
      font-weight: 600;
    }

    @keyframes loading-progress {
      from {
        width: 56%;
      }

      to {
        width: 92%;
      }
    }

    @media (max-width: 640px) {
      .load-card {
        width: calc(100vw - 48px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #loader,
      #loader:before,
      .load-progress__bar {
        animation-duration: 0.01ms;
        animation-iteration-count: 1;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="loader-wrapper">
      <div class="load-progress" aria-hidden="true">
        <div class="load-progress__bar"></div>
      </div>
      <div class="loader-section section-left"></div>
      <div class="loader-section section-right"></div>
      <div class="load-card" role="status" aria-live="polite">
        <div id="loader" aria-hidden="true"></div>
        <div class="load_title">
          <span class="load_title__message">正在加载系统资源，请耐心等待</span>
          <span class="load_title__eyebrow">BI OPERATIONS CONSOLE</span>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>

spring:
  application:
    name: manzhushaka-admin
  profiles:
    active: ${ACTIVE:dev}
  quartz:
    scheduler-name: manzhushaka-quartz
    job-store-type: memory
    properties:
      org:
        quartz:
          scheduler:
            skipUpdateCheck: true
          threadPool:
            threadCount: 5

server:
  port: 8080

sa-token:
  token-name: Authorization
  timeout: 2592000
  is-read-cookie: true
  is-read-header: false
  is-write-header: false
  is-share: false
  cookie:
    path: /
    http-only: true
    same-site: Lax

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

manzhushaka:
  db:
    crypto:
      key: ${DB_CRYPTO_KEY:}
  mq:
    group: manzhushaka-group
    consumer: oplog-consumer
    max-retry: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
